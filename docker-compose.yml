version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite:////app/data/database.db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload